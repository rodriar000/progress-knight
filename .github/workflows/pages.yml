name: Publish game

on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # Only preview PRs whose head is in this repository. Never run PR code.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
          persist-credentials: false
      - name: Prepare stable game
        run: |
          mkdir -p dist
          cp stable/index.html dist/
          cp -R stable/css stable/js dist/
          if [ -d stable/art ]; then cp -R stable/art dist/; fi
          if [ -d stable/fonts ]; then cp -R stable/fonts dist/; fi
      - name: Check out current PR for static preview
        if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Prepare preview
        if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
        run: |
          mkdir -p dist/preview
          cp candidate/index.html dist/preview/
          cp -R candidate/css candidate/js dist/preview/
          if [ -d candidate/art ]; then cp -R candidate/art dist/preview/; fi
          if [ -d candidate/fonts ]; then cp -R candidate/fonts dist/preview/; fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
